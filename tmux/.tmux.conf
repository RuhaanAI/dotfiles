# =====================================================
# Prefix & basics
# =====================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g history-limit 100000
setw -g mode-keys vi


# =====================================================
# Splits & movement
# =====================================================

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r H resize-pane -L 3
bind -r L resize-pane -R 3

bind Space last-window


# =====================================================
# Smart Vim-aware pane navigation (Safe Version)
# =====================================================

set -g @is_vim "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "#{@is_vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "#{@is_vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "#{@is_vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "#{@is_vim}" "send-keys C-l" "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R


# =====================================================
# Reload shortcut
# =====================================================

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# =====================================================
# Status bar basics (theme controlled by plugin)
# =====================================================

set -g status on
set -g status-position bottom
set -g status-interval 5


# =====================================================
# TPM + Plugins
# =====================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# -------- Gruvbox options --------
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-hard 'true'
set -g @tmux-gruvbox-statusbar 'minimal'
set -g @tmux-gruvbox-statusbar-alpha 'opaque'

# -------- Resurrect / Continuum --------
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'


# =====================================================
# TPM bootstrap (ALWAYS LAST)
# =====================================================

run '~/.tmux/plugins/tpm/tpm'
